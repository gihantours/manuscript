openapi: 3.1.0
info:
  title: Manuscript Submission Service API
  version: 1.0.0
  description: |
    Accepts manuscript submissions, returns immediately with a public ID, and
    processes each manuscript asynchronously through named stages.

    Authentication uses Sanctum personal access tokens. Send the token as
    `Authorization: Bearer <token>`.

    Error responses are JSON. Validation failures return `422` with an `errors`
    map, authorization failures return `403`, and missing/invalid tokens return
    `401`.
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.example.com
    description: Production (replace with the real origin)

tags:
  - name: Auth
  - name: Manuscripts
  - name: Editor

security:
  - sanctum: []

paths:
  /api/login:
    post:
      tags: [Auth]
      summary: Sign in and create a personal access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: author@example.com
              password: password
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/user:
    get:
      tags: [Auth]
      summary: Get the current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/manuscripts:
    get:
      tags: [Manuscripts]
      summary: List the current author's manuscripts
      description: Authors only see their own manuscripts. Paginated, 20 per page.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/NeedsAttentionFilter'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated manuscript list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedManuscripts'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Manuscripts]
      summary: Submit a manuscript
      description: |
        Accepts a multipart upload. The manuscript, its stage rows, and an outbox
        event are committed in one transaction, then `202` is returned without
        waiting for processing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, author_email, priority, file]
              properties:
                title:
                  type: string
                  maxLength: 255
                  example: Reading Habits in the Digital Age
                author_email:
                  type: string
                  format: email
                  maxLength: 255
                  example: author@example.com
                priority:
                  type: string
                  enum: [normal, high]
                file:
                  type: string
                  format: binary
                  description: Plain-text `.txt` file, valid UTF-8, non-empty, at most 10 MB.
      responses:
        '202':
          description: Accepted for asynchronous processing
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitManuscriptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Submission rate limit exceeded (30 requests per minute)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/manuscripts/{public_id}:
    get:
      tags: [Manuscripts]
      summary: Get a manuscript with its stage timeline
      description: The owning author or any editor may read a manuscript.
      parameters:
        - $ref: '#/components/parameters/PublicId'
      responses:
        '200':
          description: Manuscript detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Manuscript'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/editor/manuscripts:
    get:
      tags: [Editor]
      summary: List all manuscripts
      description: Editors only. Paginated, 20 per page, newest first.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PriorityFilter'
        - $ref: '#/components/parameters/NeedsAttentionFilter'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated manuscript list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedManuscripts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/editor/manuscripts/{public_id}/status:
    patch:
      tags: [Editor]
      summary: Change editorial status
      description: |
        Editors only. The status change is committed synchronously and returned
        immediately; the author email is queued as a separate idempotent job.
      parameters:
        - $ref: '#/components/parameters/PublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditorStatusRequest'
      responses:
        '200':
          description: New status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token

  headers:
    RequestId:
      description: Correlation ID for the request; also included in JSON logs.
      schema:
        type: string
        format: uuid

  parameters:
    PublicId:
      name: public_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^m_\d+$'
      example: m_1
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - received
          - processing
          - completed
          - failed
          - accepted
          - rejected
          - revision_requested
    PriorityFilter:
      name: priority
      in: query
      required: false
      schema:
        type: string
        enum: [normal, high]
    NeedsAttentionFilter:
      name: needs_attention
      in: query
      required: false
      schema:
        type: boolean
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Manuscript not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          example: 1|abcdefghijklmnopqrstuvwxyz
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [author, editor]

    SubmitManuscriptResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          example: m_123
        status:
          type: string
          enum: [received]

    EditorStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected, revision_requested]

    EditorStatusResponse:
      type: object
      required: [id, status, status_version]
      properties:
        id:
          type: string
          example: m_123
        status:
          type: string
          enum: [accepted, rejected, revision_requested]
        status_version:
          type: integer
          example: 1

    Manuscript:
      type: object
      required: [id, title, author_email, priority, status, needs_attention, stages]
      properties:
        id:
          type: string
          example: m_123
        title:
          type: string
        author_email:
          type: string
          format: email
        priority:
          type: string
          enum: [normal, high]
        status:
          type: string
          enum:
            - received
            - processing
            - completed
            - failed
            - accepted
            - rejected
            - revision_requested
        needs_attention:
          type: boolean
          description: True when similarity >= 70 or a stage failed.
        similarity_score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        word_count:
          type: [integer, 'null']
        preview:
          type: [string, 'null']
          description: First 200 words once the preview stage completes.
        failure_reason:
          type: [string, 'null']
        submitted_at:
          type: string
          format: date-time
        stages:
          type: array
          items:
            $ref: '#/components/schemas/Stage'

    Stage:
      type: object
      required: [name, status, attempts]
      properties:
        name:
          type: string
          enum:
            - received
            - validated
            - text_extracted
            - similarity_checked
            - preview_built
            - author_notified
            - done
        status:
          type: string
          enum: [pending, running, retrying, completed, failed]
        attempts:
          type: integer
          minimum: 0
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']

    PaginatedManuscripts:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Manuscript'
        links:
          type: object
          properties:
            first:
              type: [string, 'null']
            last:
              type: [string, 'null']
            prev:
              type: [string, 'null']
            next:
              type: [string, 'null']
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: [integer, 'null']
            last_page:
              type: integer
            per_page:
              type: integer
            to:
              type: [integer, 'null']
            total:
              type: integer

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: This action is unauthorized.

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            file:
              - The manuscript must be 10 MB or smaller.
