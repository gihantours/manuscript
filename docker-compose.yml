name: manuscript-service

x-app-environment: &app-environment
  APP_NAME: ManuscriptService
  APP_ENV: local
  APP_KEY: ${APP_KEY:-base64:UZcyeTP0HFMtNqRrwZU4QsyRkEI89qNg5FD8VGRH1wE=}
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  LOG_CHANNEL: docker
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: manuscripts
  DB_USERNAME: manuscripts
  DB_PASSWORD: secret
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_RETRY_AFTER: "180"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  FILESYSTEM_DISK: local
  SIMILARITY_SERVICE_URL: http://mock:9000
  NOTIFICATION_SERVICE_URL: http://mock:9000
  SIMILARITY_CONCURRENCY: "4"
  RUN_MIGRATIONS: "false"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "horizon"]
    environment:
      <<: *app-environment
    volumes:
      - uploads:/var/www/html/storage/app/private
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  outbox:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "outbox:work", "--sleep=1"]
    environment:
      <<: *app-environment
    volumes:
      - uploads:/var/www/html/storage/app/private
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mock:
    image: python:3.11-alpine
    environment:
      PORT: "9000"
      SEED: ${SEED:-1}
    volumes:
      - ./sample-data/mock_services.py:/app/mock_services.py:ro
    command: ["python", "/app/mock_services.py"]
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: manuscripts
      MYSQL_USER: manuscripts
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u manuscripts -psecret --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  uploads:
  frontend-node-modules:
